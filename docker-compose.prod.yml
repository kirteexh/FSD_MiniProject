version: "3.8"

services:
  # ───── Backend API & Socket.IO ─────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pharmacare-server
    restart: unless-stopped
    expose:
      - "5001"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5001
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ───── Frontend (Next.js) ─────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
        NEXT_PUBLIC_DEMO: "false"
    container_name: pharmacare-client
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      server:
        condition: service_healthy

  # ───── Nginx Reverse Proxy ─────
  nginx:
    image: nginx:alpine
    container_name: pharmacare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
