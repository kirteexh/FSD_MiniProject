name: PharmaCare CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test-and-build:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Root Dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Install Server Dependencies
        run: cd server && npm ci --ignore-scripts || npm install

      - name: Run Backend Tests (FEFO & Auth RBAC)
        run: cd server && npm test -- --runInBand

      - name: Build Server TypeScript
        run: cd server && npm run build

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: cd client && npm ci --ignore-scripts || npm install

      - name: Build Next.js Production Bundle
        run: cd client && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://fsd-miniproject-skab.onrender.com/api
          NEXT_PUBLIC_SOCKET_URL: https://fsd-miniproject-skab.onrender.com
          NEXT_PUBLIC_DEMO: 'true'

  docker-containers-check:
    name: Docker Containerization Build
    runs-on: ubuntu-latest
    needs: [backend-test-and-build, frontend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: pharmacare-server:latest

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://fsd-miniproject-skab.onrender.com/api
            NEXT_PUBLIC_SOCKET_URL=https://fsd-miniproject-skab.onrender.com
            NEXT_PUBLIC_DEMO=true
          tags: pharmacare-client:latest
